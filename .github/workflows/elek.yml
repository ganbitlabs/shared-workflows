name: elek

# Reusable elek review (https://github.com/selimozten/elek). Review-only: it can comment, never approve, merge, or close.
# Runs on pull_request events (opened, synchronize, reopened, ready_for_review). Caller: see README.md. Pass only the OPENCODE_API_KEY secret (org or repo) explicitly; do not use `secrets: inherit`.
on:
  workflow_call:
    inputs:
      provider:
        type: string
        default: opencode-go
      model:
        type: string
        default: deepseek-v4.1-flash
      thinking:
        type: string
        default: high
      severity_threshold:
        type: string
        default: important
    secrets:
      OPENCODE_API_KEY:
        required: true

jobs:
  review:
    # Fork PRs get no secrets, so skip them instead of failing on an empty key.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: selimozten/elek@4142faa458f7bd8681a63000c896bc7d069abce9 # v1.3.0
        with:
          provider: ${{ inputs.provider }}
          model: ${{ inputs.model }}
          thinking: ${{ inputs.thinking }}
          severity_threshold: ${{ inputs.severity_threshold }}
          opencode_api_key: ${{ secrets.OPENCODE_API_KEY }}
