name: elek

# Reusable elek review (https://github.com/selimozten/elek). Review-only: it can comment, never approve, merge, or close.
# Runs on pull_request events (opened, synchronize, reopened). Caller: see README.md. Pass only the OPENCODE_API_KEY secret (org or repo) explicitly; do not use `secrets: inherit`.
on:
  workflow_call:
    inputs:
      provider:
        type: string
        default: opencode-go
      model:
        type: string
        default: deepseek-v4.1-flash
      thinking:
        type: string
        default: high
      review_strategy:
        type: string
        default: crosscheck
      severity_threshold:
        type: string
        default: important
      pr_prompt:
        type: string
        default: >-
          Review this pull request for correctness, security, performance, and maintainability.
          Be specific: reference files and line numbers, and report only real problems.
    secrets:
      OPENCODE_API_KEY:
        required: true

jobs:
  review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      - uses: selimozten/elek@v1
        with:
          provider: ${{ inputs.provider }}
          model: ${{ inputs.model }}
          thinking: ${{ inputs.thinking }}
          review_strategy: ${{ inputs.review_strategy }}
          severity_threshold: ${{ inputs.severity_threshold }}
          opencode_api_key: ${{ secrets.OPENCODE_API_KEY }}
          # elek only reviews when given a trigger; the prompt is it.
          prompt: ${{ inputs.pr_prompt }}
